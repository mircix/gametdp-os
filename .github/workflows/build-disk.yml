---
# Builds the GameTDP OS USB installer (.iso) from the latest published image.
# Run it from the Actions tab ("Run workflow"); it also refreshes itself monthly so a
# recent installer is always available. Download it from the run's "Artifacts" section.
name: Build GameTDP OS installer (ISO)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 1 * *'  # 12:30 UTC on the 1st of every month
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }}  # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "stable"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer ISO
    # Not 26.04: osbuild can't mount /dev in its sandbox there
    # (https://github.com/ublue-os/image-template/issues/269)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=$(id -u)" >> ${GITHUB_ENV}
          echo "USER_GID=$(id -g)" >> ${GITHUB_ENV}
          echo "ISO_NAME=GameTDP-OS-$(date -u +%Y%m%d).iso" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          # Bazzite doesn't declare a default root filesystem, so name it (btrfs, as Bazzite uses)
          additional-args: --use-librepo=True --rootfs=btrfs

      - name: Name ISO and write checksum
        id: iso
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          ISO="$(find "${OUTPUT_DIR}" -name '*.iso' -print -quit)"
          test -n "${ISO}"
          mkdir -p upload
          mv "${ISO}" "upload/${ISO_NAME}"
          (cd upload && sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256")
          ls -lh upload

      - name: Upload ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GameTDP-OS-installer
          path: upload/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
